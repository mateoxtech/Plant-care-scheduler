<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uredi biljku</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Java Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-image: url('{{ url_for("static", filename="pozadina.jpg") }}');
            background-size: cover;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

    <!-- Navigacijska traka -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Plant Care Scheduler</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Početna</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dodaj_biljku') }}">Dodaj biljku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('vrati_biljke') }}">Popis biljaka</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('vizualizacija') }}">Zalijevanje po mjesecima</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('biljke_po_vrstama') }}">Biljke po vrsti</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Body -->
    <div class="container mt-4">
        <h2>Uredi biljku</h2>

        <form id="urediForm">

            <div class="mb-3">
                <label class="form-label">Naziv biljke:</label>
                <input type="text" class="form-control" id="naziv" value="{{ data.naziv }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Vrsta biljke:</label>
                <input type="text" class="form-control" id="vrsta" value="{{ data.vrsta }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Opis biljke:</label>
                <textarea class="form-control" id="opis" rows="3">{{ data.opis }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Datum zadnjeg zalijevanja:</label>
                <input type="text" class="form-control" id="datum_zalijevanja" value="{{ data.datum_zalijevanja }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Interval zalijevanja (u danima):</label>
                <input type="number" class="form-control" id="interval_zalijevanja" value="{{ data.interval_zalijevanja }}">
            </div>

            <button type="button" class="btn btn-primary" onclick="spremiPromjene()">Spremi promjene</button>

        </form>
    </div>

    
    <script>
        function spremiPromjene() {

            const payload = {
                naziv: document.getElementById("naziv").value,
                vrsta: document.getElementById("vrsta").value,
                opis: document.getElementById("opis").value,
                datum_zalijevanja: document.getElementById("datum_zalijevanja").value,
                interval_zalijevanja: document.getElementById("interval_zalijevanja").value
            };

            fetch(`/biljka/{{ data.id }}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.response === "Success") {
                    alert("Biljka uspješno ažurirana!");
                    window.location.href = "/vrati/biljke";
                } else {
                    alert("Greška: " + result.error);
                }
            })
            .catch(error => console.error("Greška:", error));
        }
    </script>

</body>
</html>
