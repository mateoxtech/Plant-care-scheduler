<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Java Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Dodaj biljku</title>
  </head>

  <body>

    <!-- Navigacijska traka -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Plant Care Scheduler</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('home') }}">Početna</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="{{ url_for('dodaj_biljku') }}">Dodaj biljku</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('vrati_biljke') }}">Popis biljaka</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('vizualizacija') }}">Zalijevanje po mjesecima</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('biljke_po_vrstama') }}">Biljke po vrsti</a>
            </li>

          </ul>
        </div>
      </div>
    </nav>

    <!-- Body -->
    <div class="container mt-4">
      <h2>Dodaj novu biljku</h2>

      <form method="post">

        <div class="mb-3">
          <label for="naziv" class="form-label">Naziv biljke:</label>
          <input type="text" class="form-control" id="naziv" name="naziv" required>
        </div>

        <div class="mb-3">
          <label for="vrsta" class="form-label">Vrsta biljke:</label>
          <input type="text" class="form-control" id="vrsta" name="vrsta" required>
        </div>

        <div class="mb-3">
          <label for="opis" class="form-label">Opis biljke:</label>
          <textarea class="form-control" id="opis" name="opis" rows="3" required></textarea>
        </div>

        <div class="mb-3">
          <label for="datum_zalijevanja" class="form-label">Datum zadnjeg zalijevanja:</label>
          <input type="datetime-local" class="form-control" id="datum_zalijevanja" name="datum_zalijevanja" required>
        </div>

        <div class="mb-3">
          <label for="interval_zalijevanja" class="form-label">Interval zalijevanja (u danima):</label>
          <input type="number" class="form-control" id="interval_zalijevanja" name="interval_zalijevanja" required>
        </div>

        <button type="submit" class="btn btn-primary">Dodaj biljku</button>

      </form>
    </div>

    <!-- POZADINA -->
    <style>
      body {
        background-image: url('{{ url_for("static", filename="pozadina.jpg") }}');
        background-size: cover;
        background-repeat: no-repeat;
      }
    </style>

  </body>
</html>
