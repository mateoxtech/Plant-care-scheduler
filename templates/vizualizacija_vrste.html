<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biljke po vrsti</title>

    <style>
        #canvasContainer {
            max-width: 400px;
            margin: 0 auto;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: auto;
        }

        body {
            background-image: url('{{ url_for("static", filename="pozadina.jpg") }}');
            background-size: cover;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

    <!-- Navigacijska traka -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Plant Care Scheduler</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Početna</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dodaj_biljku') }}">Dodaj biljku</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('vrati_biljke') }}">Popis biljaka</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('vizualizacija') }}">Zalijevanje po mjesecima</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('biljke_po_vrstama') }}">Biljke po vrsti</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Canvas za prikaz grafa -->
    <div id="canvasContainer" class="mt-4">
        <canvas id="grafVrste" width="300" height="300"></canvas>
    </div>

    <script>
        
        var vrste = eval("{{ vrste|safe }}")[0];

        var data = {
            labels: vrste.map(function(item) {
                return item.vrsta;
            }),
            datasets: [{
                data: vrste.map(function(item) {
                    return item.broj_biljaka;
                }),
                backgroundColor: ["#4CAF50", "#FF9800", "#2196F3", "#9C27B0", "#FF5722",
                "#00BCD4", "#795548", "#607D8B", "#E91E63", "#8BC34A"],
                borderColor: "#fff",
                borderWidth: 2
            }]
        };

        var ctx = document.getElementById("grafVrste").getContext('2d');

        var chart = new Chart(ctx, {
            type: "pie",
            data: data,
            options: {
                title: {
                    display: true,
                    text: 'Broj biljaka po vrsti'
                },
                responsive: true,
                maintainAspectRatio: false
            }
        });
    </script>

</body>
</html>
