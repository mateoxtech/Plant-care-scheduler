<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistika zalijevanja biljaka</title>

<!-- CSS only -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Java Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>

</head> <body>
<!-- Navigacijska traka -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">

    <a class="navbar-brand" href="#">Plant Care Scheduler</a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link"
             href="{{ url_for('home') }}">
            Početna
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="{{ url_for('dodaj_biljku') }}">
            Dodaj biljku
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="{{ url_for('vrati_biljke') }}">
            Popis biljaka
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link active"
             href="{{ url_for('vizualizacija') }}">
            Zalijevanje po mjesecima
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="{{ url_for('biljke_po_vrstama') }}">
            Biljke po vrsti
          </a>
        </li>

      </ul>

    </div>
  </div>
</nav>


<!-- Pozadina -->
<style>
  body {
    background-image: url('{{ url_for("static", filename="pozadina.jpg") }}');
    background-size: cover;
    background-repeat: no-repeat;
  }
</style>


<!-- Canvas za prikaz grafa -->
<div class="container">
  <h2 class="mt-4">
    Statistika zalijevanja biljaka po mjesecima
  </h2>

  <canvas id="mojGraf" width="400" height="200"></canvas>
</div>


<script>

  var x_axis = {{ x_axis|tojson }};
  var y_axis = {{ y_axis|tojson }};


  
  var formatted_x_axis = x_axis.map(function(month) {
      return moment(month, 'M').format('MMM');
  });


  var data = {
      labels: formatted_x_axis,

      datasets: [{
          label: "Broj zalijevanja po mjesecima",

          backgroundColor: "#4CAF50",
          borderColor: "#2a7f62",

          data: y_axis
      }]
  };


  var config = {
    type: "bar",

    data: data,

    options: {
        plugins: {
            legend: {
                labels: {
                    color: "#000000"
                }
            }
        },

        scales: {
            y: {
                beginAtZero: true,

                ticks: {
                    stepSize: 1,
                    precision: 0,
                    color: "#000000"
                },

                title: {
                    display: true,
                    text: "Broj zalijevanja",
                    color: "#000000"
                }
            }
        }
    }
};



  var ctx = document
      .getElementById("mojGraf")
      .getContext("2d");

  var chart = new Chart(ctx, config);

</script>

</body> </html>
